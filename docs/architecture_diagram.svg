<svg viewBox="0 0 1220 740" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <symbol id="snow" viewBox="-30 -30 60 60">
      <g stroke="#D9B45C" stroke-width="2.5" fill="none" stroke-linecap="round">
        <line x1="0" y1="-26" x2="0" y2="26"/>
        <line x1="-22.5" y1="-13" x2="22.5" y2="13"/>
        <line x1="-22.5" y1="13" x2="22.5" y2="-13"/>
        <line x1="0" y1="-18" x2="-7" y2="-24"/>
        <line x1="0" y1="-18" x2="7" y2="-24"/>
        <line x1="0" y1="18" x2="-7" y2="24"/>
        <line x1="0" y1="18" x2="7" y2="24"/>
        <line x1="-15.6" y1="-9" x2="-15.6" y2="-18"/>
        <line x1="-15.6" y1="-9" x2="-23" y2="-6"/>
        <line x1="15.6" y1="9" x2="15.6" y2="18"/>
        <line x1="15.6" y1="9" x2="23" y2="6"/>
        <line x1="-15.6" y1="9" x2="-15.6" y2="18"/>
        <line x1="-15.6" y1="9" x2="-23" y2="6"/>
        <line x1="15.6" y1="-9" x2="15.6" y2="-18"/>
        <line x1="15.6" y1="-9" x2="23" y2="-6"/>
      </g>
    </symbol>
    <symbol id="server" viewBox="0 0 100 70">
      <rect x="2" y="2" width="96" height="66" rx="6" fill="#DCE8F7" stroke="#5B8DD6" stroke-width="2"/>
      <line x1="12" y1="18" x2="88" y2="18" stroke="#5B8DD6" stroke-width="2"/>
      <line x1="12" y1="35" x2="88" y2="35" stroke="#5B8DD6" stroke-width="2"/>
      <line x1="12" y1="52" x2="88" y2="52" stroke="#5B8DD6" stroke-width="2"/>
      <circle cx="80" cy="18" r="3" fill="#5B8DD6"/>
      <circle cx="80" cy="35" r="3" fill="#5B8DD6"/>
      <circle cx="80" cy="52" r="3" fill="#5B8DD6"/>
    </symbol>
    <symbol id="barchart" viewBox="0 0 90 70">
      <rect x="5" y="40" width="18" height="30" fill="#F2C14E"/>
      <rect x="36" y="22" width="18" height="48" fill="#E8984B"/>
      <rect x="67" y="5" width="18" height="65" fill="#D9622B"/>
    </symbol>
    <symbol id="brain" viewBox="0 0 90 90">
      <circle cx="45" cy="45" r="40" fill="#2FA38C" opacity="0.12"/>
      <circle cx="45" cy="45" r="40" fill="none" stroke="#2FA38C" stroke-width="3"/>
      <path d="M25 35 Q35 20 45 35 T65 35" fill="none" stroke="#2FA38C" stroke-width="3" stroke-linecap="round"/>
      <path d="M25 55 Q35 40 45 55 T65 55" fill="none" stroke="#2FA38C" stroke-width="3" stroke-linecap="round"/>
      <line x1="45" y1="35" x2="45" y2="55" stroke="#2FA38C" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1220" height="740" fill="#FFFFFF"/>

  <!-- main title -->
  <text x="610" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#222222">Data Warehouse Architecture — Snowflake + GCS</text>

  <!-- ===================== SOURCES ===================== -->
  <rect x="20" y="70" width="200" height="630" rx="8" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="120" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#222222">Sources</text>

  <use href="#server" x="70" y="150" width="100" height="70"/>
  <text x="120" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">CRM</text>

  <use href="#server" x="70" y="295" width="100" height="70"/>
  <text x="120" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">ERP</text>

  <line x1="40" y1="430" x2="200" y2="430" stroke="#CCCCCC" stroke-width="1"/>
  <text x="40" y="455" font-size="12" fill="#444444">Object Type: CSV</text>
  <text x="40" y="475" font-size="12" fill="#444444">Interface: File in GCS</text>

  <!-- arrow: sources -> warehouse -->
  <line x1="222" y1="385" x2="256" y2="385" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===================== DATA WAREHOUSE ===================== -->
  <rect x="260" y="70" width="720" height="630" rx="8" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="620" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#222222">Data Warehouse</text>

  <!-- ===== BRONZE COLUMN ===== -->
  <rect x="280" y="120" width="213" height="560" rx="6" fill="#FFF8F0" stroke="#B5651D" stroke-width="1.2"/>
  <rect x="280" y="120" width="213" height="34" rx="6" fill="#A0522D"/>
  <text x="386" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Bronze Layer</text>
  <use href="#snow" x="351" y="155" width="70" height="70"/>
  <text x="386" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">RAW DATA</text>
  <line x1="292" y1="260" x2="480" y2="260" stroke="#E0C9A6" stroke-width="1"/>

  <text x="292" y="280" font-size="11.5" fill="#333333">Object Type: Tables</text>
  <text x="292" y="302" font-size="11.5" font-weight="700" fill="#333333">Loads:</text>
  <text x="292" y="318" font-size="11" fill="#444444">• Continuous Auto-Ingest</text>
  <text x="302" y="332" font-size="11" fill="#444444">(Snowpipe)</text>
  <text x="292" y="348" font-size="11" fill="#444444">• Incremental Append</text>
  <text x="292" y="364" font-size="11" fill="#444444">• COPY INTO</text>

  <text x="292" y="386" font-size="11.5" font-weight="700" fill="#333333">Data Transformation:</text>
  <text x="292" y="402" font-size="11" fill="#444444">• None</text>
  <text x="302" y="416" font-size="11" fill="#444444">(raw ingestion)</text>

  <line x1="292" y1="638" x2="480" y2="638" stroke="#E0C9A6" stroke-width="1"/>
  <text x="292" y="654" font-size="11.5" font-weight="700" fill="#333333">Data Model:</text>
  <text x="292" y="670" font-size="11.5" fill="#444444">As-Is</text>

  <!-- ===== SILVER COLUMN ===== -->
  <rect x="513" y="120" width="213" height="560" rx="6" fill="#F6F6F6" stroke="#9E9E9E" stroke-width="1.2"/>
  <rect x="513" y="120" width="213" height="34" rx="6" fill="#8C8C8C"/>
  <text x="619" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Silver Layer</text>
  <use href="#snow" x="584" y="155" width="70" height="70"/>
  <text x="619" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">CLEANED &amp;</text>
  <text x="619" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">STANDARDIZED DATA</text>
  <line x1="525" y1="272" x2="713" y2="272" stroke="#D5D5D5" stroke-width="1"/>

  <text x="525" y="290" font-size="11.5" fill="#333333">Object Type: Tables</text>
  <text x="525" y="310" font-size="11.5" font-weight="700" fill="#333333">Loads:</text>
  <text x="525" y="326" font-size="11" fill="#444444">• Scheduled Tasks /</text>
  <text x="535" y="340" font-size="11" fill="#444444">Streams</text>
  <text x="525" y="356" font-size="11" fill="#444444">• Incremental MERGE</text>
  <text x="535" y="370" font-size="11" fill="#444444">(Upsert)</text>
  <text x="525" y="386" font-size="11" fill="#444444">• SCD Type 2</text>
  <text x="535" y="400" font-size="11" fill="#444444">Historization</text>

  <text x="525" y="420" font-size="11.5" font-weight="700" fill="#333333">Data Transformation:</text>
  <text x="525" y="436" font-size="11" fill="#444444">• Data Cleansing</text>
  <text x="525" y="450" font-size="11" fill="#444444">• Data Standardization</text>
  <text x="525" y="464" font-size="11" fill="#444444">• Data Normalization</text>
  <text x="525" y="478" font-size="11" fill="#444444">• Derived Columns</text>
  <text x="525" y="492" font-size="11" fill="#444444">• Data Enrichment</text>

  <line x1="525" y1="638" x2="713" y2="638" stroke="#D5D5D5" stroke-width="1"/>
  <text x="525" y="654" font-size="11.5" font-weight="700" fill="#333333">Data Model:</text>
  <text x="525" y="670" font-size="11.5" fill="#444444">As-Is</text>

  <!-- ===== GOLD COLUMN ===== -->
  <rect x="746" y="120" width="213" height="560" rx="6" fill="#FFFDF0" stroke="#C9A227" stroke-width="1.2"/>
  <rect x="746" y="120" width="213" height="34" rx="6" fill="#D4AF37"/>
  <text x="852" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#4A3B00">Gold Layer</text>
  <use href="#snow" x="817" y="155" width="70" height="70"/>
  <text x="852" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">BUSINESS-READY</text>
  <text x="852" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#333333">DATA</text>
  <line x1="758" y1="272" x2="946" y2="272" stroke="#ECD98E" stroke-width="1"/>

  <text x="758" y="290" font-size="11.5" fill="#333333">Object Type: Tables</text>
  <text x="758" y="310" font-size="11.5" font-weight="700" fill="#333333">Loads:</text>
  <text x="758" y="326" font-size="11" fill="#444444">• Automated Lag-</text>
  <text x="768" y="340" font-size="11" fill="#444444">Based Refresh</text>

  <text x="758" y="362" font-size="11.5" font-weight="700" fill="#333333">Data Transformation:</text>
  <text x="758" y="378" font-size="11" fill="#444444">• Data Integration</text>
  <text x="758" y="392" font-size="11" fill="#444444">• Data Aggregation</text>
  <text x="758" y="406" font-size="11" fill="#444444">• Business Logic &amp;</text>
  <text x="768" y="420" font-size="11" fill="#444444">Rules</text>

  <line x1="758" y1="638" x2="946" y2="638" stroke="#ECD98E" stroke-width="1"/>
  <text x="758" y="654" font-size="11.5" font-weight="700" fill="#333333">Data Model:</text>
  <text x="758" y="670" font-size="11.5" fill="#444444">Star Schema</text>

  <!-- arrow: warehouse -> consume -->
  <line x1="982" y1="385" x2="998" y2="385" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===================== CONSUME ===================== -->
  <rect x="1000" y="70" width="200" height="630" rx="8" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1100" y="98" text-anchor="middle" font-size="20" font-weight="700" fill="#222222">Consume</text>

  <use href="#barchart" x="1055" y="150" width="90" height="70"/>
  <text x="1100" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">Reporting &amp; BI</text>

  <use href="#brain" x="1055" y="295" width="90" height="90"/>
  <text x="1100" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">AI / Advanced</text>
  <text x="1100" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#333333">Analytics</text>

</svg>
